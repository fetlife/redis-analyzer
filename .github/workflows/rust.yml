name: Rust

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test --verbose

  build:
    needs:
      - test

    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: self-hosted, fetlife-ci
            target: x86_64-unknown-linux-gnu

          - os-name: Linux-aarch64
            runs-on: self-hosted, fetlife-ci
            target: aarch64-unknown-linux-gnu

    runs-on:
      labels: ${{ matrix.platform.runs-on }}

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          LATEST_VERSION=$(curl -fsSL https://api.github.com/repos/rui314/mold/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          ARCH=$(uname -m)
          curl -fsSL "https://github.com/rui314/mold/releases/download/v${LATEST_VERSION}/mold-${LATEST_VERSION}-${ARCH}-linux.tar.gz" -o mold.tar.gz
          tar -xzf mold.tar.gz
          sudo cp -r "mold-${LATEST_VERSION}-${ARCH}-linux"/* /usr/local/
          rm -rf mold.tar.gz "mold-${LATEST_VERSION}-${ARCH}-linux"
          mold --version

      - name: Build Binary
        uses: gdubicki/actions-rust-cross@v1
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: "--locked --profile release"

      - name: Verify mold linker was used (Linux)
        if: runner.os == 'Linux'
        run: |
          BINARY="target/${{ matrix.platform.target }}/release/redis-analyzer"
          readelf -p .comment "$BINARY" | grep -i mold && echo "✓ mold linker confirmed" || echo "✗ mold not detected"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: redis-analyzer-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release/redis-analyzer

  build-macos:
    needs:
      - test
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Binary
        uses: gdubicki/actions-rust-cross@v1
        with:
          command: build
          target: aarch64-apple-darwin
          args: "--locked --profile release"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: redis-analyzer-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/redis-analyzer

  github-release:
    needs:
      - build
      - build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Download built binary
        uses: actions/download-artifact@v4
        with:
          name: redis-analyzer-${{ matrix.target }}
          path: binaries/

      - name: Rename binary to include target
        run: mv binaries/redis-analyzer binaries/redis-analyzer-${{ matrix.target }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
